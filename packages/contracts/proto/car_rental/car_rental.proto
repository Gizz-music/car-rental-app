syntax = "proto3";

package car_rental;

// Dates are ISO calendar dates "YYYY-MM-DD" (UTC).
// A booking occupies the half-open range [start_date, end_date):
// the car is free again on end_date.

service CarsService {
  // Without dates, a car with any active booking (current or upcoming) is unavailable
  // until the last such booking ends. With dates, availability is for that period only.
  rpc ListCars(ListCarsRequest) returns (ListCarsResponse);
}

service BookingsService {
  rpc CreateBooking(CreateBookingRequest) returns (CreateBookingResponse);
  rpc ListUserBookings(ListUserBookingsRequest) returns (ListUserBookingsResponse);
  rpc CancelBooking(CancelBookingRequest) returns (CancelBookingResponse);
  // Removes a completed or cancelled booking from the user's history.
  // Upcoming and in-progress bookings are cancelled, not deleted.
  rpc DeleteBooking(DeleteBookingRequest) returns (DeleteBookingResponse);
}

message Car {
  int32 id = 1;
  string brand = 2;
  string model = 3;
  int32 year = 4;
  string transmission = 5;
  string fuel_type = 6;
  int32 seats = 7;
  int32 price_per_day = 8;
  string image_url = 9;
}

message CarListItem {
  Car car = 1;
  bool available = 2;
  // Date (YYYY-MM-DD) when the car becomes free again.
  // Empty when the car is available for the requested period.
  string unavailable_until = 3;
}

message ListCarsRequest {
  string start_date = 1;
  string end_date = 2;
  // 1-based page number. Zero means the first page.
  int32 page = 3;
  // Zero means the default page size.
  int32 page_size = 4;
}

message ListCarsResponse {
  repeated CarListItem cars = 1;
  // Total number of cars across all pages.
  int32 total = 2;
}

// Identity of the authenticated user, filled in by the Gateway from the JWT.
message Customer {
  int32 id = 1;
  string email = 2;
  string name = 3;
}

message Booking {
  int32 id = 1;
  Car car = 2;
  string start_date = 3;
  string end_date = 4;
  string status = 5;
  int32 total_price = 6;
  string created_at = 7;
}

message CreateBookingRequest {
  int32 car_id = 1;
  string start_date = 2;
  string end_date = 3;
  Customer customer = 4;
}

message CreateBookingResponse {
  Booking booking = 1;
}

message ListUserBookingsRequest {
  int32 user_id = 1;
}

message ListUserBookingsResponse {
  repeated Booking bookings = 1;
}

// Cancels an upcoming or in-progress booking. Status becomes cancelled
// and the car is free again. A completed booking cannot be cancelled.
message CancelBookingRequest {
  reserved 2;
  reserved "user_id";
  int32 booking_id = 1;
  Customer customer = 3;
}

message CancelBookingResponse {
  Booking booking = 1;
}

message DeleteBookingRequest {
  int32 booking_id = 1;
  Customer customer = 2;
}

message DeleteBookingResponse {}
